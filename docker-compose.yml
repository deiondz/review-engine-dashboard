services:
  dashboard:
    container_name: review-engine-dashboard
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3002:3002"
    networks:
      - n8n_backend
    depends_on:
      google-reviews-scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002').then(r=>{if(r.status>=500)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  google-reviews-scraper:
    container_name: google-reviews-scraper
    build:
      context: ./services/google-reviews-scraper
      args:
        SCRAPER_COMMIT: f94b38b3c188f701f09aa24e2cb6824349da09f4
    restart: unless-stopped
    shm_size: 2gb
    volumes:
      - google_reviews_scraper_data:/data
    networks:
      - n8n_backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  google_reviews_scraper_data:

networks:
  n8n_backend:
    external: true
